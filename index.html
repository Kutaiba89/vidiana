<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>فيديانا | إنشاء الفيديو بالذكاء الاصطناعي</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Tahoma, sans-serif;
      background: #0b1020;
      color: #ffffff;
      min-height: 100vh;
    }

    .container {
      width: min(920px, 94%);
      margin: auto;
      padding: 30px 0 50px;
    }

    header {
      text-align: center;
      margin-bottom: 28px;
    }

    .logo {
      font-size: 42px;
      font-weight: 800;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #b9c1d9;
      font-size: 17px;
      line-height: 1.7;
    }

    .card {
      background: #151c30;
      border: 1px solid #2a3552;
      border-radius: 20px;
      padding: 24px;
      box-shadow: 0 15px 40px rgba(0,0,0,.25);
    }

    .field {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 700;
      color: #e8ecf7;
    }

    input,
    select,
    textarea {
      width: 100%;
      border: 1px solid #35415f;
      border-radius: 12px;
      background: #0d1324;
      color: #ffffff;
      padding: 14px;
      font-size: 16px;
      outline: none;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: #7c5cff;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 14px;
      padding: 16px;
      font-size: 18px;
      font-weight: 800;
      cursor: pointer;
      color: #ffffff;
      background: linear-gradient(135deg, #7c5cff, #a855f7);
      margin-top: 8px;
    }

    button:hover {
      opacity: .92;
    }

    #result {
      margin-top: 25px;
      display: none;
    }

    #resultText {
      background: #0d1324;
      border: 1px solid #35415f;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 15px;
      color: #dbe3f7;
      line-height: 1.7;
    }

    video {
      width: 100%;
      max-height: 520px;
      border-radius: 16px;
      background: #000000;
      margin-top: 15px;
    }

    .hint {
      color: #8f9bb8;
      font-size: 13px;
      margin-top: 7px;
    }

    .login-btn {
      background: transparent;
      border: 1px solid #35415f;
      margin-bottom: 20px;
      font-size: 15px;
      padding: 11px;
    }

    footer {
      text-align: center;
      color: #69748e;
      margin-top: 25px;
      font-size: 13px;
    }

    @media (max-width: 650px) {
      .row {
        grid-template-columns: 1fr;
      }

      .logo {
        font-size: 34px;
      }

      .card {
        padding: 18px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <header>
      <div class="logo">🎬 فيديانا</div>

      <div class="subtitle">
        منصة عربية لإنشاء الفيديوهات بالذكاء الاصطناعي
        <br>
        بسهولة واحترافية
      </div>
    </header>

    <div class="card">

      <button
        type="button"
        class="login-btn"
        >
        🔐 تسجيل الدخول
      </button>

      <form id="videoForm">

        <div class="field">
          <label for="idea">فكرة الفيديو</label>

          <textarea
            id="idea"
            name="idea"
            placeholder="اكتب فكرة الفيديو هنا..."
            required></textarea>

          <div class="hint">
            مثال: بوبا يتعلم الألوان مع لولو وميمو
          </div>
        </div>

        <div class="row">

          <div class="field">
            <label for="category">نوع الفيديو</label>

            <select id="category" name="category">
              <option value="تعليمي">تعليمي</option>
              <option value="قصصي">قصصي</option>
              <option value="أطفال">أطفال</option>
              <option value="ترفيهي">ترفيهي</option>
              <option value="إعلاني">إعلاني</option>
              <option value="معلوماتي">معلوماتي</option>
            </select>
          </div>

          <div class="field">
            <label for="duration">مدة الفيديو</label>

            <select id="duration" name="duration">
              <option value="30">30 ثانية</option>
              <option value="60" selected>60 ثانية</option>
              <option value="90">90 ثانية</option>
              <option value="120">120 ثانية</option>
            </select>
          </div>

        </div>

        <div class="row">

          <div class="field">
            <label for="style">أسلوب الفيديو</label>

            <select id="style" name="style">
              <option value="3D">رسوم ثلاثية الأبعاد 3D</option>
              <option value="كرتوني">كرتوني</option>
              <option value="واقعي">واقعي</option>
              <option value="سينمائي">سينمائي</option>
              <option value="أنيمي">أنيمي</option>
            </select>
          </div>

          <div class="field">
            <label for="language">لغة الفيديو</label>

            <select id="language" name="language">
              <option value="العربية" selected>العربية</option>
              <option value="English">English</option>
              <option value="Français">Français</option>
            </select>
          </div>

        </div>

        <button type="submit">
          🚀 إنشاء الفيديو
        </button>

      </form>

      <div id="result">

        <div id="resultText">
          جاري تجهيز الفيديو...
        </div>

      </div>

    </div>

    <footer>
      © 2026 فيديانا — جميع الحقوق محفوظة
    </footer>

  </div>

  <script src="app.js"></script>

<script src="pollinations.js"></script>

</body>
</html>
